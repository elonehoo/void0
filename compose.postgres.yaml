services:
  app:
    environment:
      VOID0_DATABASE_URL: postgresql://serverdesk_app:${VOID0_DB_PASSWORD:-${SERVERDESK_DB_PASSWORD:?Run node script/setup-postgres.mjs first}}@database:5432/serverdesk
    networks: [default, database]
    depends_on:
      database:
        condition: service_healthy
  database:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: serverdesk
      POSTGRES_USER: serverdesk_admin
      POSTGRES_PASSWORD: ${VOID0_DB_ADMIN_PASSWORD:-${SERVERDESK_DB_ADMIN_PASSWORD:?Run node script/setup-postgres.mjs first}}
      VOID0_DB_PASSWORD: ${VOID0_DB_PASSWORD:-${SERVERDESK_DB_PASSWORD:?Run node script/setup-postgres.mjs first}}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./database/init-app.sh:/docker-entrypoint-initdb.d/10-serverdesk.sh:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U serverdesk_admin -d serverdesk"]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt:
      - no-new-privileges:true
networks:
  database:
    internal: true
volumes:
  postgres-data:
